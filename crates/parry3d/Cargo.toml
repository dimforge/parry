[package]
name = "parry3d"
version.workspace = true
authors.workspace = true
description = "3 dimensional collision detection library in Rust."
documentation.workspace = true
homepage.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
license.workspace = true
edition.workspace = true

[badges]
maintenance = { status = "actively-developed" }

[lints]
workspace = true

[features]
default = ["required-features", "std", "spade"]
required-features = ["dim3", "f32"]
std = [
    "glamx/std",
    "slab",
    "simba/std",
    "arrayvec/std",
    "spade?/std",
    "thiserror/std",
    "ena",
]
dim3 = []
f32 = []
serde-serialize = [
    "serde",
    "serde_arrays",
    "glamx/serde",
    "bitflags/serde",
    "hashbrown?/serde",
    "spade?/serde",
]
rkyv = ["dep:rkyv", "glamx/rkyv"]
bytemuck-serialize = ["bytemuck", "glamx/bytemuck"]

# Widens SIMD from 4 to 8 lanes (f32 only). Needs an AVX-enabled target to
# emit 256-bit code.
simd8 = []
enhanced-determinism = ["simba/libm_force", "indexmap", "glamx/libm", "glamx/scalar-math"]
parallel = ["rayon"]
# Adds `TriMesh:to_obj_file` function.
wavefront = ["obj"]
alloc = ["hashbrown", "smallvec", "downcast-rs", "rstar", "glamx/approx"]
spade = ["dep:spade", "alloc"]
improved_fixed_point_support = []
encase = [ "dep:encase", "glamx/encase" ]

[lib]
name = "parry3d"
path = "../../src/lib.rs"
required-features = ["required-features"]

[dependencies]
either = { workspace = true }
bitflags = { workspace = true }
downcast-rs = { workspace = true, optional = true }
num-traits = { workspace = true }
slab = { workspace = true, optional = true }
arrayvec = { workspace = true }
simba = { workspace = true, features = ["wide"] }
glamx = { workspace = true, features = ["i32"] } # , "approx"] }
approx = { workspace = true }
serde = { workspace = true, optional = true, features = ["rc"] }
serde_arrays = { workspace = true, optional = true }
rkyv = { workspace = true, optional = true }
num-derive = { workspace = true }
indexmap = { workspace = true, optional = true }
hashbrown = { workspace = true, optional = true }
spade = { workspace = true, optional = true }
rayon = { workspace = true, optional = true }
bytemuck = { workspace = true, optional = true }
log = { workspace = true }
ordered-float = { workspace = true }
thiserror = { workspace = true }
rstar = { workspace = true, optional = true }
obj = { workspace = true, optional = true }
ena = { workspace = true, optional = true }
smallvec = { workspace = true, optional = true }
static_assertions = { workspace = true }
foldhash = { workspace = true }
encase = { workspace = true, optional = true }

[dev-dependencies]
oorandom = { workspace = true }
ptree = { workspace = true }
rand = { workspace = true }
kiss3d = { workspace = true }
rand_isaac = { workspace = true }
web-time = { workspace = true }
criterion = "0.8"

# Declaring any [[bench]] disables bench auto-discovery, so the pre-existing
# nightly libtest bench (`benches/all.rs`) is declared explicitly to keep it
# available unchanged.
[[bench]]
name = "all"
path = "benches/all.rs"

[[bench]]
name = "contact_manifolds"
path = "benches/contact_manifolds.rs"
harness = false

[[bench]]
name = "gjk_epa"
path = "benches/gjk_epa.rs"
harness = false

[[bench]]
name = "bvh_queries"
path = "benches/bvh_queries.rs"
harness = false

[package.metadata.docs.rs]
rustdoc-args = ["-Zunstable-options", "--generate-link-to-definition"]
cargo-args = ["-Zunstable-options", "-Zrustdoc-scrape-examples"]
features = ["wavefront"]

